name: Checks

# Runs on every pull request so a broken build or failing test shows up
# before it reaches main and the Pages deploy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: portfolio/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: node --test scripts/share-pages.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run build
      - run: node --test scripts/prerender.test.mjs
      - run: npm run check:budget
